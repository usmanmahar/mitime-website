[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Old site addresses → new pages
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
[[redirects]]
  from = "/phd-positions"
  to = "/doctoral-candidates/"
  status = 301
[[redirects]]
  from = "/recruiting"
  to = "/doctoral-candidates/"
  status = 301
[[redirects]]
  from = "/timeline"
  to = "/about/"
  status = 301
